<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Zitro</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#111;
            color:white;
        }

        .inicio{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
            url("https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1600&q=80");

            background-size:cover;
            background-position:center;
            text-align:center;
        }

        h1{
            font-size:70px;
            color:#FFD700;
        }

        h2{
            margin-top:20px;
            font-weight:300;
        }

        p{
            margin-top:20px;
            font-size:20px;
        }

        .boton{
            margin-top:40px;
            padding:18px 40px;
            background:#FFD700;
            color:black;
            text-decoration:none;
            font-weight:bold;
            border-radius:50px;
            transition:.3s;
        }

        .boton:hover{
            transform:scale(1.08);
        }

    </style>

</head>

<body>

<section class="inicio">

<h1>GRUPO ZITRO</h1>

<h2>Ingeniería • Diseño • Construcción</h2>

<p>Construimos tus ideas con calidad y compromiso.</p>

<a href="#" class="boton">Solicitar Cotización</a>

</section>

</body>

</html>
